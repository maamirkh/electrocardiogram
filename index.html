<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Electrocardiogram</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #0a0e27 0%, #1a0a0a 25%, #0d1a2a 50%, #1a0e1e 75%, #0a0e27 100%);
    background-size: 400% 400%;
    animation: gradientShift 15s ease infinite;
    overflow: hidden;
    position: relative;
  }

  @keyframes gradientShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* Floating particles */
  .particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }

  .particle {
    position: absolute;
    border-radius: 50%;
    opacity: 0;
    animation: float linear infinite;
  }

  @keyframes float {
    0%   { transform: translateY(100vh) scale(0); opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 1; }
    100% { transform: translateY(-10vh) scale(1); opacity: 0; }
  }

  /* ECG line band across the page */
  .ecg-band {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg,
      #ef4444, #f97316, #eab308, #22c55e, #3b82f6,
      #8b5cf6, #ef4444, #f97316, #eab308, #22c55e, #3b82f6
    );
    z-index: 10;
    opacity: 0.8;
  }

  .ecg-band-bottom {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg,
      #3b82f6, #22c55e, #eab308, #f97316, #ef4444,
      #8b5cf6, #3b82f6, #22c55e, #eab308, #f97316, #ef4444
    );
    z-index: 10;
    opacity: 0.8;
  }

  /* Main card */
  .card {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 60px 50px;
    max-width: 700px;
    width: 90%;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 24px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow:
      0 8px 32px rgba(0, 0, 0, 0.3),
      inset 0 1px 0 rgba(255, 255, 255, 0.05);
    animation: cardFadeIn 1s ease-out;
  }

  @keyframes cardFadeIn {
    from { opacity: 0; transform: translateY(30px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Heart icon */
  .icon {
    width: 80px;
    height: 80px;
    margin: 0 auto 30px;
    position: relative;
  }

  .heart-icon {
    width: 70px;
    height: 70px;
    margin: 0 auto;
    position: relative;
    animation: heartbeat 1.5s ease-in-out infinite;
  }

  .heart-icon svg {
    width: 100%;
    height: 100%;
    fill: #ef4444;
    filter: drop-shadow(0 0 15px rgba(239, 68, 68, 0.5)) drop-shadow(0 0 30px rgba(239, 68, 68, 0.25));
  }

  .heart-icon .pulse-ring {
    position: absolute;
    inset: -8px;
    border: 2px solid #ef4444;
    border-radius: 50%;
    animation: pulseRing 1.5s ease-out infinite;
    opacity: 0;
  }

  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    14%      { transform: scale(1.15); }
    28%      { transform: scale(1); }
    42%      { transform: scale(1.1); }
    56%      { transform: scale(1); }
  }

  @keyframes pulseRing {
    0%   { transform: scale(0.8); opacity: 0.7; }
    100% { transform: scale(1.5); opacity: 0; }
  }

  /* ECG trace line in the card */
  .ecg-trace {
    width: 100%;
    height: 40px;
    margin: 0 auto 24px;
    overflow: hidden;
    position: relative;
  }

  .ecg-trace svg {
    width: 100%;
    height: 100%;
  }

  .ecg-line {
    fill: none;
    stroke: #22c55e;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    filter: drop-shadow(0 0 6px rgba(34, 197, 94, 0.6));
    stroke-dasharray: 600;
    stroke-dashoffset: 600;
    animation: drawECG 3s ease-in-out infinite;
  }

  @keyframes drawECG {
    0%   { stroke-dashoffset: 600; }
    50%  { stroke-dashoffset: 0; }
    100% { stroke-dashoffset: -600; }
  }

  /* Title */
  .title {
    font-size: 3.2rem;
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: 16px;
    background: linear-gradient(135deg, #fecaca 0%, #ef4444 30%, #f97316 60%, #fecaca 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: none;
    line-height: 1.2;
  }

  /* Subtitle */
  .subtitle {
    font-size: 1.15rem;
    color: rgba(180, 200, 230, 0.7);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 40px;
    font-weight: 300;
  }

  /* CTA Button */
  .cta-btn {
    display: inline-block;
    padding: 16px 48px;
    font-size: 1.05rem;
    font-weight: 600;
    letter-spacing: 1px;
    color: #fff;
    text-decoration: none;
    border: none;
    border-radius: 50px;
    background: linear-gradient(135deg, #ef4444 0%, #dc2626 50%, #b91c1c 100%);
    background-size: 200% 200%;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    box-shadow: 0 4px 20px rgba(239, 68, 68, 0.35);
    animation: btnGlow 3s ease-in-out infinite;
  }

  @keyframes btnGlow {
    0%, 100% { box-shadow: 0 4px 20px rgba(239, 68, 68, 0.35); }
    50%      { box-shadow: 0 4px 35px rgba(239, 68, 68, 0.55), 0 0 60px rgba(239, 68, 68, 0.15); }
  }

  .cta-btn:hover {
    transform: translateY(-3px) scale(1.03);
    box-shadow: 0 8px 40px rgba(239, 68, 68, 0.5);
  }

  .cta-btn:active {
    transform: translateY(-1px) scale(1.01);
  }

  .cta-btn::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -60%;
    width: 200%;
    height: 200%;
    background: linear-gradient(
      90deg,
      transparent,
      rgba(255, 255, 255, 0.15),
      transparent
    );
    transform: rotate(25deg);
    animation: shimmer 4s ease-in-out infinite;
  }

  @keyframes shimmer {
    0%, 100% { left: -60%; }
    50%      { left: 60%; }
  }

  .btn-arrow {
    display: inline-block;
    margin-left: 8px;
    transition: transform 0.3s ease;
  }

  .cta-btn:hover .btn-arrow {
    transform: translateX(4px);
  }

  /* Footer note */
  .footer-note {
    margin-top: 36px;
    font-size: 0.8rem;
    color: rgba(150, 170, 200, 0.4);
    letter-spacing: 1px;
  }

  /* Responsive */
  @media (max-width: 600px) {
    .card {
      padding: 40px 24px;
    }
    .title {
      font-size: 2rem;
      letter-spacing: 1px;
    }
    .subtitle {
      font-size: 0.9rem;
      letter-spacing: 2px;
    }
    .cta-btn {
      padding: 14px 36px;
      font-size: 0.95rem;
    }
    .icon { width: 60px; height: 60px; }
    .heart-icon { width: 54px; height: 54px; }
  }
</style>
</head>
<body>

<div class="ecg-band"></div>
<div class="ecg-band-bottom"></div>

<!-- Floating particles -->
<div class="particles" id="particles"></div>

<!-- Main Card -->
<div class="card">
  <div class="icon">
    <div class="heart-icon">
      <div class="pulse-ring"></div>
      <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
    </div>
  </div>

  <!-- Animated ECG trace -->
  <div class="ecg-trace">
    <svg viewBox="0 0 400 40" preserveAspectRatio="none">
      <polyline class="ecg-line" points="0,20 40,20 60,20 70,18 80,20 90,20 100,20 110,22 115,8 120,35 125,2 130,32 135,20 145,20 160,14 175,22 190,20 220,20 260,20 270,18 280,20 290,20 300,20 310,22 315,8 320,35 325,2 330,32 335,20 345,20 360,14 375,22 400,20"/>
    </svg>
  </div>

  <h1 class="title">Electrocardiogram</h1>
  <p class="subtitle">3D Interactive ECG Simulator</p>
  <a href="simulation.html" class="cta-btn">
    Launch Simulator <span class="btn-arrow">&rarr;</span>
  </a>
  <p class="footer-note">Interactive 3D Heart &amp; ECG Simulation</p>
</div>

<script>
  // Generate floating particles
  (function() {
    var container = document.getElementById('particles');
    var colors = [
      'rgba(239,68,68,0.6)', 'rgba(220,38,38,0.5)', 'rgba(248,113,113,0.4)',
      'rgba(34,197,94,0.3)', 'rgba(59,130,246,0.3)', 'rgba(249,115,22,0.3)',
      'rgba(234,179,8,0.4)', 'rgba(139,92,246,0.3)'
    ];
    for (var i = 0; i < 30; i++) {
      var p = document.createElement('div');
      p.className = 'particle';
      var size = Math.random() * 4 + 2;
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      p.style.left = Math.random() * 100 + '%';
      p.style.background = colors[Math.floor(Math.random() * colors.length)];
      p.style.animationDuration = (Math.random() * 10 + 8) + 's';
      p.style.animationDelay = (Math.random() * 10) + 's';
      container.appendChild(p);
    }
  })();
</script>
</body>
</html>
